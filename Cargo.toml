[package]
name = "bieu-thue-xnk"
version = "1.0.0"
edition = "2021"
description = "Phần mềm tra cứu Biểu thuế Xuất Nhập khẩu 2026"

[[bin]]
name = "bieu-thue-xnk"
path = "src/main.rs"

[dependencies]
eframe      = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui        = "0.29"
egui_extras = { version = "0.29", features = [] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
